name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Tests run on macOS too, where most people run Runrail; the checks that do not depend on the
  # platform run on Linux only. On GitHub's macOS runners a test that opens a terminal
  # (Bun.spawn with `terminal`) has hung, so that leg reports but does not hold up a release.
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The root config covers src and test only; the maintained scripts are checked here.
      - name: Typecheck scripts
        if: runner.os == 'Linux'
        run: bunx tsc --noEmit -p tsconfig.scripts.json

      - name: Check publishable package metadata
        if: runner.os == 'Linux'
        run: bun run package:check
      - name: Check public source boundary
        if: runner.os == 'Linux'
        run: bun run source:check

      # A step that times out fails, which continue-on-error covers; a job that times out is
      # cancelled, which it does not, and the release job would never run.
      - name: Run tests
        timeout-minutes: 15
        run: bun test

      - name: Pack published Nifra artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/nifra-runrail-pack
          npm pack @nifrajs/agent-protocol@5.8.0 --pack-destination /tmp/nifra-runrail-pack
          npm pack @nifrajs/agent@5.8.0 --pack-destination /tmp/nifra-runrail-pack
          npm pack @nifrajs/agent-review@5.8.0 --pack-destination /tmp/nifra-runrail-pack
          npm pack @nifrajs/core@5.8.0 --pack-destination /tmp/nifra-runrail-pack
          npm pack @nifrajs/jobs@5.8.0 --pack-destination /tmp/nifra-runrail-pack
          npm pack @nifrajs/coding-agent@5.8.0 --pack-destination /tmp/nifra-runrail-pack
          npm pack @nifrajs/mcp@5.8.0 --pack-destination /tmp/nifra-runrail-pack
          npm pack @nifrajs/pi@5.8.0 --pack-destination /tmp/nifra-runrail-pack

      - name: Validate packed public imports
        if: runner.os == 'Linux'
        run: bun run test:packed

  # The standalone executables a release ships, each built and smoke-tested on the platform it
  # is for (darwin-x64 through Rosetta). Pull requests build them too, so a break shows before a
  # tag. Windows is experimental: its failure does not hold up the release.
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-x64
          - os: ubuntu-24.04-arm
            targets: linux-arm64
          - os: macos-latest
            targets: darwin-arm64 darwin-x64
          - os: windows-latest
            targets: windows-x64
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Rosetta runs the Intel build on the Apple silicon runner for its smoke test.
      - name: Install Rosetta
        if: runner.os == 'macOS'
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Build and smoke-test
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          args=()
          for target in $TARGETS; do args+=(--target "$target"); done
          bun scripts/build-binaries.ts --out dist/binaries --smoke "${args[@]}"

      - name: Keep the archives for the release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.os }}
          path: |
            dist/binaries/*.tar.gz
            dist/binaries/*.zip
          if-no-files-found: error
          retention-days: 7

  # A version tag (v0.1.0, matching package.json and with a CHANGELOG.md section) collects the
  # package, the executables, install.sh, and SHA256SUMS.txt into a draft GitHub release: nobody
  # sees it until a maintainer publishes it, which also runs publish.yml.
  release:
    name: Draft release
    needs: [verify, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Check the tag and the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(bun -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match version $version in package.json"
            exit 1
          fi
          awk -v v="$version" '/^## \[/ { p = index($0, "[" v "]") == 4; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Collect the executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binaries-*
          path: release
          merge-multiple: true

      - name: Pack the release
        run: |
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            if [ ! -f "release/runrail-$VERSION-$platform.tar.gz" ]; then
              echo "::error::the $platform executable is missing"
              exit 1
            fi
          done
          if [ ! -f "release/runrail-$VERSION-windows-x64.zip" ]; then
            echo "::warning::the experimental Windows executable did not build; the release goes out without it"
          fi
          bun pm pack --destination release
          cp install.sh release/install.sh
          (cd release && sha256sum -- * > SHA256SUMS.txt)

      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t files < <(find release -type f | sort)
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published; its files are not replaced."
              exit 1
            fi
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            prerelease=()
            [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${prerelease[@]}" \
              --title "Runrail ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
